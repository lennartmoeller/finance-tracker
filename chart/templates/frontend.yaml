apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/lennartmoeller/finance-tracker-frontend:{{ .Chart.AppVersion }}
          env:
            - name: API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: finance-tracker
                  key: API_TOKEN
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      {{- with .Values.frontend.nodePort }}
      nodePort: {{ . }}
      {{- end }}
