[tools]
actionlint = "1.7.12"
helm = "4.3.1"
node = "26.13.0"
# Any pnpm switches itself to the version in package.json's packageManager, the one pnpm pin.
pnpm = "latest"
shellcheck = "0.11.0"

[tasks.check]
shell = "bash -euo pipefail -c"
run = [
  "pnpm install --frozen-lockfile",
  "pnpm check",
  "helm lint --strict chart",
  "actionlint",
]
