name: Release

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.next_version }}
      tag: ${{ steps.next.outputs.next_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}
          fetch-depth: 0

      - name: Release next version
        id: next
        uses: lennartmoeller/release-from-conventional-commits@7764ed22b8fe067d3583b44121e206bd691a534e # v0.1.2
        with:
          write_version: |
            yq -i '.version = strenv(VERSION) | .appVersion = strenv(VERSION)' chart/Chart.yaml
            yq -i '.version = strenv(VERSION)' src/browser-extension/package.json
          create_github_release: false

  images:
    name: Images
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [backend, frontend]
    steps:
      - name: Log in to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.server_url }}/${{ github.repository }}.git#${{ needs.version.outputs.tag }}
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/lennartmoeller/finance-tracker-${{ matrix.target }}:${{ needs.version.outputs.version }}

  chart:
    name: Chart
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Package chart
        run: |
          set -euo pipefail
          helm package chart

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"

      - name: Push chart
        run: |
          set -euo pipefail
          helm push "finance-tracker-$VERSION.tgz" oci://ghcr.io/lennartmoeller/charts

  extension:
    name: Extension
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.tag }}
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0

      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Sign extension
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          set -euo pipefail
          pnpm --filter @finance-tracker/browser-extension sign

      - name: Name signed file
        run: |
          set -euo pipefail
          mv src/browser-extension/.output/signed/*.xpi "finance-tracker-$VERSION.xpi"

      - name: Write update manifest
        run: |
          set -euo pipefail
          jq -n \
            --arg id "$(jq -r .browser_specific_settings.gecko.id src/browser-extension/.output/firefox-mv3/manifest.json)" \
            --arg version "$VERSION" \
            --arg link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/finance-tracker-$VERSION.xpi" \
            '{addons: {($id): {updates: [{version: $version, update_link: $link}]}}}' >updates.json

      - name: Upload extension
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: |
            finance-tracker-${{ env.VERSION }}.xpi
            updates.json
          if-no-files-found: error

  release:
    name: Release
    needs: [version, chart, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download extension
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "finance-tracker-${TAG#v}.xpi" updates.json
