name: Release

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write

  version:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve the last version
        id: last
        run: |
          set -euo pipefail
          tag="$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1 || true)"
          version="${tag#v}"
          echo "version=${version:-0.0.0}" >>"$GITHUB_OUTPUT"

      - name: Resolve the next version
        id: next
        env:
          LAST_VERSION: ${{ steps.last.outputs.version }}
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          footers="$(git log -1 --format=%b | awk 'BEGIN { RS = "" } END { print }')"
          if grep -Eiq '^[a-z]+(\([^)]+\))?!: ' <<<"$subject" || grep -Eq '^BREAKING[ -]CHANGE(: | #)' <<<"$footers"; then
            bump="major"
          elif grep -Eiq '^feat(\([^)]+\))?: ' <<<"$subject"; then
            bump="minor"
          else
            bump="patch"
          fi
          IFS=. read -r major minor patch <<<"$LAST_VERSION"
          case "$bump" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
          esac
          echo "version=$next" >>"$GITHUB_OUTPUT"

      - name: Push the tag
        env:
          VERSION: ${{ steps.next.outputs.version }}
        run: |
          set -euo pipefail
          git tag "v$VERSION"
          git push origin "v$VERSION"

  images:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        target: [backend, frontend]
    steps:
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          target: ${{ matrix.target }}
          push: true
          tags: ghcr.io/lennartmoeller/finance-tracker-${{ matrix.target }}:${{ needs.version.outputs.version }}

  chart:
    needs: [version, images]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version-file: .tool-versions

      - name: Package the chart
        run: |
          set -euo pipefail
          helm package chart --version "$VERSION" --app-version "$VERSION"

      - name: Log in to ghcr.io
        env:
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<<"$TOKEN"

      - name: Push the chart
        run: |
          set -euo pipefail
          helm push "finance-tracker-$VERSION.tgz" oci://ghcr.io/lennartmoeller/charts

  extension:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/install

      - name: Stamp the version
        working-directory: src/browser-extension
        run: |
          set -euo pipefail
          npm pkg set version="$VERSION"

      - name: Sign the extension
        env:
          WEB_EXT_API_KEY: ${{ secrets.WEB_EXT_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.WEB_EXT_API_SECRET }}
        run: |
          set -euo pipefail
          pnpm --filter @finance-tracker/browser-extension sign

      - name: Name the signed file
        run: |
          set -euo pipefail
          mv src/browser-extension/.output/signed/*.xpi "finance-tracker-$VERSION.xpi"

      - name: Write the update manifest
        run: |
          set -euo pipefail
          jq -n \
            --arg id "$(jq -r .browser_specific_settings.gecko.id src/browser-extension/.output/firefox-mv3/manifest.json)" \
            --arg version "$VERSION" \
            --arg link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/v$VERSION/finance-tracker-$VERSION.xpi" \
            '{addons: {($id): {updates: [{version: $version, update_link: $link}]}}}' >updates.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: extension
          path: |
            finance-tracker-${{ env.VERSION }}.xpi
            updates.json
          if-no-files-found: error

  release:
    needs: [version, chart, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: extension

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes "finance-tracker-$VERSION.xpi" updates.json
